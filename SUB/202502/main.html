<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Frame with Button</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100vh; /* ビューポートの高さを確保 */
      border: none;
    }
    button {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1000;
      font-size: 2em;  /* 文字サイズ2倍 */
      padding: 20px 40px; /* ボタンのサイズを大きく */
      background-color: blue; /* 背景色を青に */
      color: white; /* 文字色を白に */
      border: none;
      border-radius: 8px; /* 角を丸く */
      cursor: pointer;
    }
    button:hover {
      background-color: darkblue; /* ホバー時に少し暗く */
    }
  </style>
  <script>
  </script>
</head>
<body>
  <iframe src="index.html"></iframe>
</body>
</html>
