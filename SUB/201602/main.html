<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Resizable PDF Frames</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    .root { height: 100%; display: flex; background: #f5f5f5; gap: 0; }

    .left {
      width: 65%;
      min-width: 280px;
      background: #fff;
      border-right: 1px solid #ddd;
      overflow: hidden;
    }

    .right {
      flex: 1;
      min-width: 260px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #f5f5f5;
    }

    .top, .bottom {
      height: 50%;
      min-height: 180px;
      background: #fff;
      overflow: hidden;
      border-left: 1px solid #ddd;
    }
    .top { border-bottom: 1px solid #ddd; }

    iframe { width: 100%; height: 100%; border: 0; }

    .splitter-v {
      width: 8px;
      cursor: col-resize;
      background: #e9e9e9;
      border-right: 1px solid #d0d0d0;
      border-left: 1px solid #d0d0d0;
    }
    .splitter-h {
      height: 8px;
      cursor: row-resize;
      background: #e9e9e9;
      border-top: 1px solid #d0d0d0;
      border-bottom: 1px solid #d0d0d0;
    }
    .splitter-v:hover, .splitter-h:hover { background: #dedede; }
    .dragging { user-select: none; cursor: default; }
  </style>
</head>
<body>
  <div class="root" id="root">
    <div class="left" id="leftPane">
      <iframe src="script.pdf" title="script.pdf"></iframe>
    </div>

    <div class="splitter-v" id="splitV" title="ドラッグして左右幅を調整"></div>

    <div class="right" id="rightPane">
      <div class="top" id="topPane">
        <iframe src="question.pdf" title="question.pdf"></iframe>
      </div>

      <div class="splitter-h" id="splitH" title="ドラッグして上下高さを調整"></div>

      <div class="bottom" id="bottomPane">
        <iframe src="answer.pdf" title="answer.pdf"></iframe>
      </div>
    </div>
  </div>

  <script>
    const root = document.getElementById('root');
    const leftPane = document.getElementById('leftPane');
    const rightPane = document.getElementById('rightPane');
    const topPane = document.getElementById('topPane');
    const splitV = document.getElementById('splitV');
    const splitH = document.getElementById('splitH');

    splitV.addEventListener('pointerdown', (e) => {
      splitV.setPointerCapture(e.pointerId);
      document.body.classList.add('dragging');

      const rect = root.getBoundingClientRect();
      const minLeft = 280;
      const minRight = 260;

      const onMove = (ev) => {
        let newLeft = ev.clientX - rect.left;
        newLeft = Math.max(minLeft, newLeft);
        newLeft = Math.min(rect.width - minRight, newLeft);
        leftPane.style.width = newLeft + 'px';
      };

      const onUp = () => {
        document.body.classList.remove('dragging');
        splitV.removeEventListener('pointermove', onMove);
        splitV.removeEventListener('pointerup', onUp);
        splitV.removeEventListener('pointercancel', onUp);
      };

      splitV.addEventListener('pointermove', onMove);
      splitV.addEventListener('pointerup', onUp);
      splitV.addEventListener('pointercancel', onUp);
    });

    splitH.addEventListener('pointerdown', (e) => {
      splitH.setPointerCapture(e.pointerId);
      document.body.classList.add('dragging');

      const rect = rightPane.getBoundingClientRect();
      const minTop = 180;
      const minBottom = 180;

      const onMove = (ev) => {
        let newTop = ev.clientY - rect.top;
        newTop = Math.max(minTop, newTop);
        newTop = Math.min(rect.height - minBottom, newTop);
        topPane.style.height = newTop + 'px';
      };

      const onUp = () => {
        document.body.classList.remove('dragging');
        splitH.removeEventListener('pointermove', onMove);
        splitH.removeEventListener('pointerup', onUp);
        splitH.removeEventListener('pointercancel', onUp);
      };

      splitH.addEventListener('pointermove', onMove);
      splitH.addEventListener('pointerup', onUp);
      splitH.addEventListener('pointercancel', onUp);
    });
  </script>
</body>
</html>
