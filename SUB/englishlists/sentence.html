<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>英文と韓国語訳</title>
  <style>
    .korean {
      display: none;
    }
    .block {
      margin: 30px;
      padding: 10px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

<h2 style="text-align:center;">英文と韓国語訳</h2>
<p>speed :
  <select id="spspead">
    <option value="0.2">0.2</option>
    <option value="0.5">0.5</option>
    <option value="0.8">0.8</option>
    <option value="1.0" selected>1.0</option>
    <option value="1.2">1.2</option>
    <option value="1.5">1.5</option>
  </select>
  
repeat :
  <select id="sprepeat">
    <option value="1">1</option>
    <option value="3" selected>3</option>
    <option value="5">5</option>
    <option value="10" >10</option>
    <option value="20">20</option>
  </select>  
</p>
<div id="sentenceContainer"></div>

<script>





// 表示切替と読み上げスクリプト
function showKorean() {
  document.getElementById("korean01").style.display = "block";
}

function speakText(id) {
  const text = document.getElementById(id).innerText;
  let count = 0;
  maxCnt = document.getElementById("sprepeat").value;
  function speak() {
      if (count >= maxCnt) return;

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "en-US";
	speed = document.getElementById("spspead").value;
	utterance.rate = speed; 
    utterance.onend = () => {
      count++;
      speak();
    };

    speechSynthesis.speak(utterance);
  }

  speak();
}

fetch('./文章.txt')
  .then(response => response.text())
  .then(data => {
    // 空行を除去
    const lines = data.trim().split(/\r?\n/).filter(line => line.trim() !== '');
    const container = document.getElementById('sentenceContainer');

    for (let i = 0; i < lines.length; i += 2) {
      const english = lines[i];
      const korean = lines[i + 1] || ''; // 万一不揃いでも空文字で対応

      const englishId = `english${i}`;
      const koreanId = `korean${i}`;

      const block = document.createElement('div');
      block.className = 'block';

      block.innerHTML = `
        <p id="${englishId}">${english}</p>
        <button onclick="document.getElementById('${koreanId}').style.display='block'">한국어 표시</button>
        <p id="${koreanId}" class="korean">${korean}</p>
        <button onclick="speakText('${englishId}')">🔊 読み上げる</button>
      `;

      container.appendChild(block);
    }
  });
</script>

</body>
</html>
