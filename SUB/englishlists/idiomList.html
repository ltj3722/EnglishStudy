<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>熟語一覧</title>
  <style>
    .hidden {
      display: none;
    }    
  #wordTable {
    margin-left: 0; /* 左側の余白をなくす */
  }
    table {
      border-collapse: collapse;
      margin: 20px auto;
    }
    th, td {
      border: 1px solid #aaa;
      padding: 6px;
      text-align: left;
    }
    th {
      background-color: #f0f0f0;
    }
    tbody tr:nth-child(even) {
      background-color: #f9f9f9;
    }
  </style>
  <script>
    function toggleMeaning(button) {
      const meaningCell = button.parentElement.nextElementSibling.nextElementSibling;
	  const wordCell = button.parentElement.nextElementSibling;
      //meaningCell.classList.toggle("hidden");
      button.textContent = meaningCell.classList.contains("hidden") ? "show" : "hide";
	  wordCell.innerHTML = wordCell.innerHTML + " | " + meaningCell.innerHTML
    }
  </script>    
</head>
<body>

<h2 style="text-align:center;">熟語一覧（英語と意味）</h2>
<table id="wordTable">
  <thead>
    <tr>
      <th>Word</th>
      <th>Mean</th>
    </tr>
  </thead>
  <tbody>
    <!-- JavaScriptがここにデータを挿入します -->
  </tbody>
</table>


<script>
// 熟語ファイルのURL
const idiomListUrl = './熟語.txt';

// 熟語ファイルを読み込んでテーブルに表示
fetch(idiomListUrl)
  .then(response => {
    if (!response.ok) {
      throw new Error(
        `熟語.txtの取得に失敗: HTTP ${response.status}`
      );
    }
    return response.text();
  })
  .then(text => {
    const lines = text.split(/\r?\n/);
    const tbody = document.querySelector('#wordTable tbody');

    // 既存の行をクリア
    tbody.replaceChildren();

    lines.forEach(line => {
      // 空行を無視
      if (!line.trim()) return;

      // タブまたは複数スペースで分割
      const parts = line.trim().split(/\s{2,}|\t+/);
      const word = parts[0] || '';
      const meaning = parts.slice(1).join(' ') || '';

      // テーブルの行を作成
      const row = document.createElement('tr');

      // Showボタン
      const buttonCell = document.createElement('td');
      const button = document.createElement('button');
      button.textContent = 'show';

      // 英熟語
      const wordCell = document.createElement('td');
      wordCell.textContent = word;

      // 日本語の意味（初期状態は非表示）
      const meaningCell = document.createElement('td');
      meaningCell.textContent = meaning;
      meaningCell.classList.add('meaning', 'hidden');

      // Show / Hide 切り替え
      button.addEventListener('click', () => {
        meaningCell.classList.toggle('hidden');

        button.textContent =
          meaningCell.classList.contains('hidden')
            ? 'show'
            : 'hide';
      });

      buttonCell.appendChild(button);
      row.appendChild(buttonCell);
      row.appendChild(wordCell);
      row.appendChild(meaningCell);

      tbody.appendChild(row);
    });

    console.log(
      '熟語ファイルの読み込み成功:',
      tbody.rows.length,
      '件'
    );
  })
  .catch(err => {
    console.error('読み込みエラー:', err);

    // PC・iPhoneの両方でエラー内容を表示
    const errorMessage = document.createElement('p');
    errorMessage.style.color = 'red';
    errorMessage.style.textAlign = 'center';
    errorMessage.textContent =
      '熟語ファイルの読み込みに失敗しました: ' + err.message;

    document.getElementById('wordTable')
      .insertAdjacentElement('afterend', errorMessage);
  });
</script>


</body>
</html>
