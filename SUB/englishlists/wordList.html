<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>単語一覧</title>

<style>
.hidden {
    display: none;
}

table {
    border-collapse: collapse;
    margin: 20px 0;
}

th, td {
    border: 1px solid #aaa;
    padding: 6px;
    text-align: left;
}

th {
    background: #f0f0f0;
}

tbody tr:nth-child(even) {
    background: #f9f9f9;
}	

/* 覚える単語 */
.marked {
    background: #ffe4e1 !important;
}

button {
    cursor: pointer;
}
</style>

<script>
// 単語の意味を表示
function toggleMeaning(button) {
    const row = button.parentElement.parentElement;
    const meaningCell = row.children[2];
    const wordCell = row.children[1];

    wordCell.innerHTML = wordCell.innerHTML + " | " + meaningCell.innerHTML;
}

/* 覚える単語の状態を切り替える */
async function markWord(button) {
    const row = button.parentElement.parentElement;
    const word = row.children[1].innerText;

    row.classList.toggle("marked");

    try {
        // ① 現在のmarks.jsonを取得
        let currentData = {};
        try {
            const res = await fetch(marksJsonUrl);
            if (res.ok) {
                currentData = await res.json();
            }
        } catch (e) {
            currentData = {};
        }

        // ② データ更新
        if (row.classList.contains("marked")) {
            currentData[word] = true;
        } else {
            delete currentData[word];
        }

        // ③ PAR URLにPUT（★ここが重要）
        const putResponse = await fetch(marksJsonUrl, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(currentData)
        });

        if (!putResponse.ok) {
            throw new Error("PUT failed: " + putResponse.status);
        }

        console.log("Updated marks.json");

    } catch (error) {
        console.error("Error updating marks:", error);
    }
}

</script>
</head>

<body>

<h2 style="text-align:center;">単語一覧</h2>

<table id="wordTable">
<thead>
<tr>
    <th>Mark</th>
    <th>Word</th>
    <th>Mean</th>
</tr>
</thead>

<tbody></tbody>

</table>

<script>
// marks.jsonのURL
// ✅ 正しい（PAR URL）
let marksJsonUrl = 'marks.json';

// 単語リストのファイルのURL
//let wordListUrl = 'https://objectstorage.us-ashburn-1.oraclecloud.com/n/dbcloudoci/b/Taejong_bucket-20211029/o/English/englishlists/%E5%8D%98%E8%AA%9E.txt';
//let wordListUrl = 'https://objectstorage.us-ashburn-1.oraclecloud.com/n/dbcloudoci/b/Taejong_bucket-20211029/o/English%2Fenglishlists%2F%E5%8D%98%E8%AA%9E.txt';
  let wordListUrl = '5%8D%98%E8%AA%9E.txt'
// 単語リストを取得
fetch(wordListUrl)
    .then(r => r.text())
    .then(async text => {
        // marks.jsonからマーク情報を取得
        const markData = await fetch(marksJsonUrl).then(r => r.json());

        const lines = text.split('\n');
        const tbody = document.querySelector('#wordTable tbody');

        lines.forEach(line => {
            if (!line.trim()) return;

            const parts = line.trim().split(/\s{2,}|\t+/);

            const word = parts[0] || '';
            const meaning = parts.slice(1).join(' ') || '';

            const row = document.createElement('tr');

            // marks.jsonでマークされている場合、"marked"クラスを追加
            if (markData[word] ) {
                row.classList.add("marked");
            }

            row.innerHTML = `
                <td>
                    <button onclick="toggleMeaning(this)">Show</button>
                </td>
                <td>${word}</td>
                <td class="meaning hidden">${meaning}</td>
                <td>
                    <button onclick="markWord(this)">★</button>
                </td>
            `;

            tbody.appendChild(row);
        });
    })
    .catch(error => console.error('Error loading word list:', error));
</script>

</body>
</html>
